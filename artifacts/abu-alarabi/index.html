    <!-- ═══ Performance ═══════════════════════════════════════════════════════════ -->
    <!-- Tajawal WOFF2 files are processed by Vite (src/assets/tajawal-*.woff2)
         and emitted with content-hash filenames for immutable long-term caching.
         font-display:swap in index.css means the pre-rendered hero text shows
         immediately in the system-ui fallback and swaps to Tajawal when loaded.
         No preload needed — font-display:swap prevents invisible text.         -->

    <!-- ═══ LCP Bootstrap script ════════════════════════════════════════════════
         Fires the API call BEFORE React loads (no JS framework needed).
         On response it:
           1. stores data in window.__HOMEPAGE__ so React uses it as initialData
              (zero re-fetch when React mounts)
           2. dynamically injects <link rel="preload"> for the first ad image so
              the browser starts downloading it ~3 s before React would normally
              discover the URL (HTML → JS → React → API → image is now
              HTML → API [parallel with JS] → image)
    ════════════════════════════════════════════════════════════════════════════ -->
    <script>
    !function(){try{fetch('/api/public/homepage').then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)return;window.__HOMEPAGE__=d;var a=d.ads&&d.ads[0];if(!a)return;var m=window.innerWidth<640,src=m?(a.mobileImageUrl||a.imageUrl):a.imageUrl;if(!src)return;var l=document.createElement('link');l.rel='preload';l.as='image';l.fetchPriority='high';l.href=src;document.head.appendChild(l)})}catch(e){}}()
    </script>
