components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── AUTH ─────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [fullName, phone, password, confirmPassword]
      properties:
        fullName:
          type: string
          minLength: 3
        phone:
          type: string
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string

    LoginInput:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean

    AuthResult:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        onboardingRequired:
          type: boolean

    User:
      type: object
      required: [id, fullName, phone, role, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [student, teacher, assistant_teacher, moderator, admin, super_admin]
        avatarUrl:
          type: ["string", "null"]
        onboardingCompleted:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string

    OnboardingInput:
      type: object
      required: [grade, field, availableHoursPerDay, studyDays, goal, studyStyle]
      properties:
        grade:
          type: string
        field:
          type: string
        school:
          type: string
        tawjihiYear:
          type: integer
        isRepeating:
          type: boolean
        subjectIds:
          type: array
          items:
            type: integer
        subjectLevels:
          type: object
          additionalProperties:
            type: string
        availableHoursPerDay:
          type: number
        studyDays:
          type: array
          items:
            type: string
        goal:
          type: string
        studyStyle:
          type: string

    # ─── PROFILE ─────────────────────────────────────────
    StudentProfile:
      type: object
      required: [id, fullName, phone, grade, field, goal, studyHoursPerDay, streakDays, totalStudyMinutes]
      properties:
        id:
          type: integer
        fullName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: ["string", "null"]
        grade:
          type: string
        field:
          type: string
        school:
          type: ["string", "null"]
        goal:
          type: string
        studyHoursPerDay:
          type: number
        studyDays:
          type: array
          items:
            type: string
        streakDays:
          type: integer
        totalStudyMinutes:
          type: integer
        totalSessions:
          type: integer
        totalExams:
          type: integer
        averageScore:
          type: number
        tawjihiYear:
          type: integer
        joinedAt:
          type: string

    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        avatarUrl:
          type: string
        goal:
          type: string
        studyHoursPerDay:
          type: number
        studyDays:
          type: array
          items:
            type: string
        school:
          type: string

    Achievement:
      type: object
      required: [id, title, description, icon, earnedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        earnedAt:
          type: ["string", "null"]
        isEarned:
          type: boolean

    # ─── SUBJECTS ─────────────────────────────────────────
    Subject:
      type: object
      required: [id, name, grade, field]
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        field:
          type: string
        iconUrl:
          type: ["string", "null"]
        color:
          type: string
        totalUnits:
          type: integer
        totalLessons:
          type: integer
        studentProgress:
          type: ["number", "null"]

    SubjectInput:
      type: object
      required: [name, grade, field]
      properties:
        name:
          type: string
        grade:
          type: string
        field:
          type: string
        color:
          type: string
        iconUrl:
          type: string

    SubjectDetail:
      type: object
      required: [id, name, grade, field, units]
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        field:
          type: string
        units:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        studentProgress:
          type: ["number", "null"]

    Unit:
      type: object
      required: [id, title, order, totalLessons]
      properties:
        id:
          type: integer
        title:
          type: string
        order:
          type: integer
        totalLessons:
          type: integer
        totalDossiers:
          type: integer
        progress:
          type: ["number", "null"]

    # ─── DOSSIERS ─────────────────────────────────────────
    Dossier:
      type: object
      required: [id, title, subjectId, subjectName, grade, pageCount, downloads, rating]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        subjectId:
          type: integer
        subjectName:
          type: string
        grade:
          type: string
        pageCount:
          type: integer
        fileSize:
          type: ["string", "null"]
        downloads:
          type: integer
        views:
          type: integer
        rating:
          type: number
        coverUrl:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        isFavorite:
          type: boolean
        readingProgress:
          type: integer
        lastReadPage:
          type: integer
        createdAt:
          type: string

    AdminDossierInput:
      type: object
      required: [title, subjectId, grade]
      properties:
        title:
          type: string
        description:
          type: string
        subjectId:
          type: integer
        grade:
          type: string
        pageCount:
          type: integer
        fileSize:
          type: string
        fileUrl:
          type: string
        coverUrl:
          type: string

    DossierList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dossier"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    FavoriteResult:
      type: object
      required: [isFavorite]
      properties:
        isFavorite:
          type: boolean

    DossierProgressUpdate:
      type: object
      required: [currentPage]
      properties:
        currentPage:
          type: integer

    # ─── WORKSHEETS ───────────────────────────────────────
    Worksheet:
      type: object
      required: [id, title, subjectId, subjectName, grade, difficulty, questionCount]
      properties:
        id:
          type: integer
        title:
          type: string
        subjectId:
          type: integer
        subjectName:
          type: string
        grade:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        questionCount:
          type: integer
        estimatedMinutes:
          type: integer
        downloads:
          type: integer
        solvers:
          type: integer
        fileUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    WorksheetList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Worksheet"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ─── EXAMS ───────────────────────────────────────────
    Exam:
      type: object
      required: [id, title, subjectId, subjectName, questionCount, durationMinutes, type, difficulty]
      properties:
        id:
          type: integer
        title:
          type: string
        subjectId:
          type: integer
        subjectName:
          type: string
        questionCount:
          type: integer
        durationMinutes:
          type: integer
        type:
          type: string
          enum: [full, unit, lesson, weekly, diagnostic, ministerial]
        difficulty:
          type: string
          enum: [easy, medium, hard, ministerial]
        totalParticipants:
          type: integer
        averageScore:
          type: ["number", "null"]
        isAvailable:
          type: boolean
        userAttempts:
          type: integer
        maxAttempts:
          type: integer

    AdminExamInput:
      type: object
      required: [title, subjectId, type, difficulty, durationMinutes]
      properties:
        title:
          type: string
        subjectId:
          type: integer
        type:
          type: string
        difficulty:
          type: string
        durationMinutes:
          type: integer
        instructions:
          type: string
        passingScore:
          type: number
        totalScore:
          type: number
        canGoBack:
          type: boolean
        canSkip:
          type: boolean
        maxAttempts:
          type: integer
        deductOnWrong:
          type: boolean

    ExamDetail:
      type: object
      required: [id, title, subjectId, subjectName, questionCount, durationMinutes, type, instructions]
      properties:
        id:
          type: integer
        title:
