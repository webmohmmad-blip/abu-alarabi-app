openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: منصة أبو العربي - API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: subjects
  - name: dossiers
  - name: worksheets
  - name: exams
  - name: quiz
  - name: studyplan
  - name: sessions
  - name: notes
  - name: flashcards
  - name: statistics
  - name: dashboard
  - name: notifications
  - name: comments
  - name: admin
  - name: admin-users
  - name: admin-groups
  - name: admin-content
  - name: admin-rbac
  - name: admin-settings
  - name: admin-reports
  - name: admin-audit

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/onboarding:
    post:
      operationId: completeOnboarding
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── USER PROFILE ───────────────────────────────────────
  /users/profile:
    get:
      operationId: getProfile
      tags: [users]
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
    patch:
      operationId: updateProfile
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"

  /users/achievements:
    get:
      operationId: getAchievements
      tags: [users]
      responses:
        "200":
          description: Achievements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  # ─── SUBJECTS ───────────────────────────────────────────
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      responses:
        "200":
          description: Subjects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"

  /subjects/{id}:
    get:
      operationId: getSubject
      tags: [subjects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"

  # ─── DOSSIERS ───────────────────────────────────────────
  /dossiers:
    get:
      operationId: listDossiers
      tags: [dossiers]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: grade
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Dossiers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierList"

  /dossiers/{id}:
    get:
      operationId: getDossier
      tags: [dossiers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dossier detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dossier"

  /dossiers/{id}/favorite:
    post:
      operationId: toggleDossierFavorite
      tags: [dossiers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Favorite toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResult"

  /dossiers/{id}/progress:
    patch:
      operationId: updateDossierProgress
      tags: [dossiers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DossierProgressUpdate"
      responses:
        "200":
          description: Progress updated

  # ─── WORKSHEETS ─────────────────────────────────────────
  /worksheets:
    get:
      operationId: listWorksheets
      tags: [worksheets]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Worksheets list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorksheetList"

  /worksheets/{id}:
    get:
      operationId: getWorksheet
      tags: [worksheets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Worksheet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worksheet"

  # ─── EXAMS ──────────────────────────────────────────────
  /exams:
    get:
      operationId: listExams
      tags: [exams]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Exams list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exam"

  /exams/{id}:
    get:
      operationId: getExam
      tags: [exams]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exam detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamDetail"

  /exams/{id}/start:
    post:
      operationId: startExam
      tags: [exams]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Exam attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttempt"

  /exams/attempts/{attemptId}/answer:
    post:
      operationId: submitAnswer
      tags: [exams]
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Answer saved

  /exams/attempts/{attemptId}/submit:
    post:
      operationId: submitExam
      tags: [exams]
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exam result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResult"

  /exams/results:
    get:
      operationId: listExamResults
      tags: [exams]
      responses:
        "200":
          description: Results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamResult"

  # ─── WEEKLY QUIZ ────────────────────────────────────────
  /quiz/current:
    get:
      operationId: getCurrentQuiz
      tags: [quiz]
      responses:
        "200":
          description: Current quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyQuiz"

  /quiz/{id}/start:
    post:
      operationId: startQuiz
      tags: [quiz]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Quiz attempt started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttempt"

  /quiz/leaderboard:
    get:
      operationId: getQuizLeaderboard
      tags: [quiz]
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # ─── STUDY PLAN ─────────────────────────────────────────
  /studyplan:
    get:
      operationId: getStudyPlan
      tags: [studyplan]
      responses:
        "200":
          description: Study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"

  /studyplan/tasks:
    get:
      operationId: listStudyTasks
      tags: [studyplan]
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: subjectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyTask"

  /studyplan/tasks/{id}/complete:
    post:
      operationId: completeStudyTask
      tags: [studyplan]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletionInput"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTask"

  /studyplan/rebuild:
    post:
      operationId: rebuildStudyPlan
      tags: [studyplan]
      responses:
        "200":
          description: New plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"

  # ─── STUDY SESSIONS ─────────────────────────────────────
  /sessions:
    get:
      operationId: listStudySessions
      tags: [sessions]
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: subjectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySession"
    post:
      operationId: createStudySession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"

  /sessions/{id}:
    patch:
      operationId: updateStudySession
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionUpdate"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"

  # ─── NOTES ──────────────────────────────────────────────
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: dossierId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: isPinned
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    patch:
      operationId: updateNote
      tags: [notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Note deleted

  # ─── FLASHCARDS ─────────────────────────────────────────
  /flashcards:
    get:
      operationId: listFlashcards
      tags: [flashcards]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: deckId
          in: query
          schema:
            type: integer
        - name: dueOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Flashcards list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flashcard"
    post:
      operationId: createFlashcard
      tags: [flashcards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardInput"
      responses:
        "201":
          description: Flashcard created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"

  /flashcards/{id}/review:
    post:
      operationId: reviewFlashcard
      tags: [flashcards]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardReviewInput"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"

  /flashcard-decks:
    get:
      operationId: listFlashcardDecks
      tags: [flashcards]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Decks list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardDeck"
    post:
      operationId: createFlashcardDeck
      tags: [flashcards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardDeckInput"
      responses:
        "201":
          description: Deck created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"

  # ─── STATISTICS ─────────────────────────────────────────
  /statistics:
    get:
      operationId: getStatistics
      tags: [statistics]
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"

  /statistics/subjects:
    get:
      operationId: getSubjectStatistics
      tags: [statistics]
      responses:
        "200":
          description: Subject statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectStat"

  # ─── DASHBOARD ──────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /dashboard/platform-stats:
    get:
      operationId: getPlatformStats
      tags: [dashboard]
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  # ─── NOTIFICATIONS ──────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read

  # ─── COMMENTS (Academic Q&A) ────────────────────────────
  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a piece of content
      parameters:
        - name: contentType
          in: query
          required: true
          schema:
            type: string
            enum: [dossier, worksheet, exam, subject, lesson]
        - name: contentId
          in: query
          required: true
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, helpful, teacher_first]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
    post:
      operationId: createComment
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    patch:
      operationId: updateComment
      tags: [comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdate"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
    delete:
      operationId: deleteComment
      tags: [comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted

  /comments/{id}/helpful:
    post:
      operationId: markCommentHelpful
      tags: [comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked helpful

  /comments/{id}/accept:
    post:
      operationId: acceptAnswer
      tags: [comments]
      summary: Teacher marks an answer as accepted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted

  /comments/{id}/report:
    post:
      operationId: reportComment
      tags: [comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Reported

  /comments/{id}/replies:
    post:
      operationId: createReply
      tags: [comments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ─── ADMIN — Dashboard ──────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard overview stats
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/activity:
    get:
      operationId: getAdminActivity
      tags: [admin]
      summary: Live activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── ADMIN — Users ───────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin-users]
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: groupId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
    post:
      operationId: adminCreateUser
      tags: [admin-users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
